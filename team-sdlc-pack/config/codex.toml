model_auto_compact_token_limit = 100000

# Every shell command the agents run: pnpm 10/11 must not run an implicit install before a script
# (verify-deps-before-run). Without a TTY it aborts with ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY;
# with one it waits on a prompt. Rehearsals 2026-10-29 and 2026-10-31 lost items to both.
[shell_environment_policy]
set = { npm_config_verify_deps_before_run = "false", pnpm_config_verify_deps_before_run = "false" }

# Codex multi-agent v2 caps the open threads of a session (root + every live subagent): 4 by default
# in Codex 0.166, i.e. 3 workers. Rehearsal 2026-10-31: spawn_agent failed twice with "agent thread
# limit reached" and BUG-04 waited 3.5 min for a slot. The Codex ceiling stays 16 while the helper now
# admits at most 10 workers, leaving headroom for recovery and UI activity. `enabled = true` is required: the table form
# alone turns the feature off, and the team skills use the v2 tools (fork_turns, followup_task).
[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 16

[mcp_servers.mtm_minimal]
command = "node"
args = ["../team-sdlc-pack/runtime/bin/runtime-server.mjs"]
startup_timeout_sec = 15
tool_timeout_sec = 300
